# The diagnostics on the data of the pilot's second run, decided by the owner on 2026-10-17 and planned in
# validation/exploratory/real_pilot_diagnostics_plan.md before the run. Exploratory, on development data
# only. The second run (real-pilot-2.yml, results/real-pilot-2) stays as it is; nothing is read from the
# Census again.
#
# On every push to the pilot's pull request: the dry run. The pilot's and the diagnostics' tests; the
# diagnostics' whole path on a fabricated case (real_pilot_select.py --synthetic --second) with fabricated
# STRING files; and the real inputs fetched and checked, without any computation on them: the second run's
# files against its SHA256SUMS, and STRING v12.0's mouse files downloaded and parsed. Nothing is committed.
#
# The real run, once, started by the label "pilot-run-3" on the pull request:
# - check: the run's first attempt, and the branch results/real-pilot-3 must not exist;
# - prepare: the inputs (real_pilot_3_inputs.sh), to the artifact pilot3-inputs;
# - run: two parallel jobs (case 1's claims 1a, 1a-males and 1b; case 2's 2a and 2b), each every check, in
#   v1's analysis environment (requirements-panel.txt, v1's numerical settings) with the engine of the tag
#   v0.3.0-prereg from a worktree (src/ the tag's byte for byte);
# - collect: once the checks have started, whatever they produced is merged and committed to the new branch
#   results/real-pilot-3, failures included.
# A second start finds the branch and stops. If the preparation fails, no check starts and nothing is
# committed: a fix and a second start are then recorded in the report.
name: Real-data pilot, diagnostics on the second run's data (exploratory, v0.3.0's engine)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  FROZEN_TAG: v0.3.0-prereg
  SRC_TREE: 97cbab3c437c9ddb118a0690e6e0d24f8a16069f
  SRC_SHA256: 17e9a04f6fdd82e98606da89ad98cdce9a7f22fc35c1b31235efcb0637b132e8
  RESULTS_BRANCH: results/real-pilot-3
  # the numerical environment of v1's jobs (validation.yml)
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: Haswell
  NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
  PYTHONHASHSEED: "0"

jobs:
  dry:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: The engine of the tag from a worktree, src/ the tag's byte for byte
        run: |
          git fetch -q origin "refs/tags/$FROZEN_TAG:refs/tags/$FROZEN_TAG"
          git worktree add -q "$RUNNER_TEMP/engine" "$FROZEN_TAG"
          test "$(git -C "$RUNNER_TEMP/engine" rev-parse HEAD:src)" = "$SRC_TREE"
          sum=$(cd "$RUNNER_TEMP/engine" && find src -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          test "$sum" = "$SRC_SHA256" || { echo "src/ sha256 $sum, D1 records $SRC_SHA256"; exit 1; }
      - name: The two environments, the selection's (the fabricated case) and the analyses'
        run: |
          lscpu | grep -E "Model name|^Flags" | cut -c1-400
          python -m venv "$RUNNER_TEMP/venv-select"
          python -m venv "$RUNNER_TEMP/venv-panel"
          "$RUNNER_TEMP/venv-select/bin/python" -m pip install -q pip==26.2.1
          "$RUNNER_TEMP/venv-select/bin/pip" install -q --no-deps -r validation/prereg/requirements-select.txt
          "$RUNNER_TEMP/venv-select/bin/pip" check
          "$RUNNER_TEMP/venv-panel/bin/python" -m pip install -q pip==26.2.1
          "$RUNNER_TEMP/venv-panel/bin/pip" install -q --no-deps -r validation/prereg/requirements-panel.txt
          "$RUNNER_TEMP/venv-panel/bin/pip" install -q --no-deps pytest==9.1.1 pluggy==1.6.0 iniconfig==2.3.1 pygments==2.21.0
          "$RUNNER_TEMP/venv-panel/bin/pip" check
          "$RUNNER_TEMP/venv-panel/bin/pip" install -q --no-deps -e "$RUNNER_TEMP/engine"
          "$RUNNER_TEMP/venv-panel/bin/python" -c "import metric_autopsy as m, pathlib, sys; p = pathlib.Path(m.__file__).resolve(); print(m.__version__, p); sys.exit(0 if str(p).startswith(str(pathlib.Path('$RUNNER_TEMP/engine').resolve())) else 1)"
      - name: The pilot's and the diagnostics' tests
        run: |
          cd validation/exploratory
          "$RUNNER_TEMP/venv-panel/bin/python" -m pytest -q -p no:cacheprovider -c /dev/null test_real_pilot.py test_real_pilot_diagnostics.py
      - name: The diagnostics' whole path on a fabricated case and fabricated STRING files (SYNTHETIC)
        run: |
          "$RUNNER_TEMP/venv-select/bin/python" validation/exploratory/real_pilot_select.py --synthetic --second --out-dir dry/data
          py="$RUNNER_TEMP/venv-panel/bin/python"
          "$py" validation/exploratory/real_pilot_diagnostics.py --data dry/data --out dry/string --fabricate-string dry/string
          for part in case1 case2; do
            "$py" validation/exploratory/real_pilot_diagnostics.py --data dry/data --string dry/string --out "dry/part-$part" --part "$part" > "dry/$part.stdout"
          done
          "$py" validation/exploratory/real_pilot_diagnostics.py --merge dry/part-* --out dry/merged
          if grep -n "EXCEPTION\|MISMATCH\|MISSING\|INCOMPLETE\|undetermined" dry/merged/real_pilot_3.log; then exit 1; fi
      - name: The real inputs, fetched and checked (the second run's files by their hashes; STRING downloaded and parsed), nothing computed on them
        run: |
          bash validation/exploratory/real_pilot_3_inputs.sh "$RUNNER_TEMP/inputs"
          "$RUNNER_TEMP/venv-panel/bin/python" validation/exploratory/real_pilot_diagnostics.py --string "$RUNNER_TEMP/inputs/string" --out "$RUNNER_TEMP/string-stats" --string-stats

  check:
    if: github.event.action == 'labeled' && github.event.label.name == 'pilot-run-3'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: One run, one attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "the diagnostics run once: this is attempt $GITHUB_RUN_ATTEMPT"; exit 1; }
          if git ls-remote --exit-code "https://github.com/${{ github.repository }}.git" "refs/heads/$RESULTS_BRANCH" > /dev/null; then
            echo "$RESULTS_BRANCH exists: the diagnostics have run"; exit 1
          fi

  prepare:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: The inputs (the second run's files by their hashes; STRING v12.0 mouse)
        run: |
          set -o pipefail
          mkdir -p inputs
          bash validation/exploratory/real_pilot_3_inputs.sh inputs | tee inputs/inputs.log
          echo "PR head ${{ github.event.pull_request.head.sha }}; workflow run ${{ github.run_id }}" >> inputs/inputs.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot3-inputs
          path: inputs
          if-no-files-found: error

  run:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    strategy:
      fail-fast: false
      matrix:
        part: [case1, case2]
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: The engine of the tag from a worktree, src/ the tag's byte for byte
        run: |
          git fetch -q origin "refs/tags/$FROZEN_TAG:refs/tags/$FROZEN_TAG"
          git worktree add -q "$RUNNER_TEMP/engine" "$FROZEN_TAG"
          test "$(git -C "$RUNNER_TEMP/engine" rev-parse HEAD:src)" = "$SRC_TREE"
          sum=$(cd "$RUNNER_TEMP/engine" && find src -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          test "$sum" = "$SRC_SHA256" || { echo "src/ sha256 $sum, D1 records $SRC_SHA256"; exit 1; }
      - name: v1's analysis environment and the engine
        run: |
          lscpu | grep -E "Model name|^Flags" | cut -c1-400
          python -m pip install -q pip==26.2.1
          pip install -q --no-deps -r validation/prereg/requirements-panel.txt && pip check
          pip install -q --no-deps -e "$RUNNER_TEMP/engine"
          python -c "import metric_autopsy as m, pathlib, sys; p = pathlib.Path(m.__file__).resolve(); print(m.__version__, p); sys.exit(0 if str(p).startswith(str(pathlib.Path('$RUNNER_TEMP/engine').resolve())) else 1)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot3-inputs
          path: inputs
      - name: The checks of ${{ matrix.part }}
        timeout-minutes: 240
        run: python validation/exploratory/real_pilot_diagnostics.py --data inputs/data --string inputs/string --run2 inputs/data/real_pilot.json --out "out-${{ matrix.part }}" --part "${{ matrix.part }}"
      - name: The analysis environment, as installed
        if: always()
        run: |
          mkdir -p "out-${{ matrix.part }}"
          pip freeze > "out-${{ matrix.part }}/panel-freeze-${{ matrix.part }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pilot3-out-${{ matrix.part }}
          path: out-${{ matrix.part }}
          if-no-files-found: warn

  collect:
    needs: [prepare, run]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: v1's analysis environment and the engine (the merge imports the diagnostics script)
        run: |
          git fetch -q origin "refs/tags/$FROZEN_TAG:refs/tags/$FROZEN_TAG"
          git worktree add -q "$RUNNER_TEMP/engine" "$FROZEN_TAG"
          test "$(git -C "$RUNNER_TEMP/engine" rev-parse HEAD:src)" = "$SRC_TREE"
          python -m pip install -q pip==26.2.1
          pip install -q --no-deps -r validation/prereg/requirements-panel.txt && pip check
          pip install -q --no-deps -e "$RUNNER_TEMP/engine"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot3-inputs
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: pilot3-out-*
          path: parts
      - name: Merge the parts (a part that is missing is recorded as missing)
        run: |
          mkdir -p parts merged
          python validation/exploratory/real_pilot_diagnostics.py --merge parts parts/* --out merged
      - name: Commit everything, as it is, to results/real-pilot-3 (a second start finds the branch and stops)
        if: always()
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$remote" "refs/heads/$RESULTS_BRANCH" > /dev/null; then
            echo "$RESULTS_BRANCH exists: nothing is pushed"; exit 1
          fi
          pub="$RUNNER_TEMP/pub"
          mkdir -p "$pub/inputs" "$pub/run/parts"
          cp inputs/inputs.log inputs/run2-SHA256SUMS "$pub/inputs/" || echo "missing: the inputs' log"
          [ -d merged ] && cp -r merged/. "$pub/run/"
          for d in parts/*; do if [ -d "$d" ]; then cp -r "$d" "$pub/run/parts/"; fi; done
          workflow_blob=$(git rev-parse "HEAD:.github/workflows/real-pilot-3.yml")
          {
            echo "# The pilot's diagnostics on the second run's data, with v0.3.0's engine (exploratory, development data)"
            echo
            echo "- Workflow run ${{ github.run_id }} (attempt $GITHUB_RUN_ATTEMPT) of \`.github/workflows/real-pilot-3.yml\` (blob $workflow_blob), at the pull request's head ${{ github.event.pull_request.head.sha }}; the plan: \`validation/exploratory/real_pilot_diagnostics_plan.md\` there."
            echo "- The engine: the tag $FROZEN_TAG, src/ git tree $SRC_TREE (sha256 of its files' sha256 list $SRC_SHA256), installed from a worktree."
            echo "- The jobs: prepare ${{ needs.prepare.result }}; run (case 1 and case 2) ${{ needs.run.result }}."
            echo "- The data: the second run's files on results/real-pilot-2 at bad785a3c56e9de1ee24737953c1b4b63112aa7c (inputs/inputs.log: each checked against that run's SHA256SUMS, copied to inputs/run2-SHA256SUMS); not copied here. STRING v12.0 (CC BY 4.0), mouse: https://stringdb-downloads.org/download/protein.info.v12.0/10090.protein.info.v12.0.txt.gz and .../protein.links.v12.0/10090.protein.links.v12.0.txt.gz, their sha256 in inputs/inputs.log; not copied here."
            echo "- run/: the merged log and JSON (real_pilot_3.log, real_pilot_3.json: the outcomes by check and claim, whether each check separates, the owner's prediction scored), the engine's reports of check (i) (reports/) and each part's own outputs (parts/)."
          } > "$pub/README.md"
          cd "$pub"
          find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          git init -q -b "$RESULTS_BRANCH"
          git config user.name "metric-autopsy validation"
          git config user.email "validation@users.noreply.github.com"
          git add -A
          git commit -qm "The pilot's diagnostics on the second run's data (workflow run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git push "$remote" "HEAD:refs/heads/$RESULTS_BRANCH" && break; sleep $((i * 10)); done
          test "$(git ls-remote "$remote" "refs/heads/$RESULTS_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "----- real_pilot_3.log (the outcomes) -----"
          sed -n '/^## Outcomes by check and claim/,$p' run/real_pilot_3.log || true
