# The fourth run of v0.4 on the development data, decided by the owner on 2026-10-18 (the second decisions)
# and planned in validation/exploratory/real_pilot_6_plan.md before the run. Exploratory, on development
# data only: §4 again (A3, A4) as a recorded second attempt, and Xist, the Y genes and SEA-AD again (A1, A2,
# A8), with the engine of this pull request's src/ after the second decisions; and what the TMS authors
# write about the origin of the 3-month FACS data (their texts fetched, quoted, not archived).
#
# On every push to the pull request: the dry run. The run's tests; the whole path on a fabricated Census and
# fabricated texts; and the real inputs checked without any computation on them: the earlier runs' files
# against their SHA256SUMS, the Census opened at the release to count each case's measured genes.
#
# The real run, once, started by the label "pilot-run-6" on the pull request:
# - check: the run's first attempt, and the branch results/real-pilot-6 must not exist;
# - prepare: the inputs (real_pilot_5_inputs.sh, without GEO's matrices), to the artifact pilot6-inputs;
# - text: the TMS authors' texts, quoted (real_pilot_6_text.py), to the artifact pilot6-text;
# - extract: the full set of genes for the cases' cells and case 1's metadata (the third run's code), in
#   v1's selection environment (requirements-select.txt), to the artifact pilot6-full;
# - run: six parallel parts, in v1's analysis environment (requirements-panel.txt, v1's numerical
#   settings) with the engine of this pull request's head (src/, its git tree recorded);
# - collect: once the extraction has succeeded, whatever the parts and the text produced is merged and
#   committed to the new branch results/real-pilot-6, failures included.
# A second start finds the branch and stops. If the preparation or the extraction fails, no analysis
# starts and nothing is committed: a fix and a second start are then recorded in the report.
name: Real-data pilot, the fourth run of v0.4 (exploratory)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  RESULTS_BRANCH: results/real-pilot-6
  # the numerical environment of v1's jobs (validation.yml)
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: Haswell
  NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
  PYTHONHASHSEED: "0"

jobs:
  dry:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: The two environments, the selection's and the analyses' (the engine of this head's src/)
        run: |
          lscpu | grep -E "Model name|^Flags" | cut -c1-400
          echo "src/ git tree $(git rev-parse HEAD:src)"
          python -m venv "$RUNNER_TEMP/venv-select"
          python -m venv "$RUNNER_TEMP/venv-panel"
          "$RUNNER_TEMP/venv-select/bin/python" -m pip install -q pip==26.2.1
          "$RUNNER_TEMP/venv-select/bin/pip" install -q --no-deps -r validation/prereg/requirements-select.txt
          "$RUNNER_TEMP/venv-select/bin/pip" check
          "$RUNNER_TEMP/venv-panel/bin/python" -m pip install -q pip==26.2.1
          "$RUNNER_TEMP/venv-panel/bin/pip" install -q --no-deps -r validation/prereg/requirements-panel.txt
          "$RUNNER_TEMP/venv-panel/bin/pip" install -q --no-deps pytest==9.1.1 pluggy==1.6.0 iniconfig==2.3.1 pygments==2.21.0
          "$RUNNER_TEMP/venv-panel/bin/pip" check
          "$RUNNER_TEMP/venv-panel/bin/pip" install -q --no-deps -e .
          "$RUNNER_TEMP/venv-panel/bin/python" -c "import metric_autopsy as m, pathlib, sys; p = pathlib.Path(m.__file__).resolve(); print(m.__version__, p); sys.exit(0 if str(p).startswith(str(pathlib.Path('src').resolve())) else 1)"
      - name: The run's tests
        run: |
          cd validation/exploratory
          "$RUNNER_TEMP/venv-panel/bin/python" -m pytest -q -p no:cacheprovider -c /dev/null test_real_pilot_6.py
      - name: The whole path on a fabricated Census and fabricated texts (SYNTHETIC)
        run: |
          sel="$RUNNER_TEMP/venv-select/bin/python"
          py="$RUNNER_TEMP/venv-panel/bin/python"
          "$sel" validation/exploratory/real_pilot_select.py --synthetic --second --out-dir dry/run2
          "$sel" validation/exploratory/real_pilot_select.py --synthetic --out-dir dry/run1
          mkdir -p dry/inputs/data
          cp dry/run2/case1.npz dry/run2/case2.npz dry/run2/select.json dry/inputs/data/
          cp dry/run1/case3.npz dry/inputs/data/ && cp dry/run1/select.json dry/inputs/data/select1.json
          "$sel" validation/exploratory/real_pilot_6_extract.py --data dry/inputs/data --out dry/full --synthetic --chunk 1000
          for part in case2 case1m case1 case3a case3b case3c; do
            "$py" validation/exploratory/real_pilot_6.py --inputs dry/inputs --full dry/full --part "$part" --out "dry/parts/part-$part" --synthetic
          done
          "$py" validation/exploratory/real_pilot_6.py --merge dry/parts --out dry/merged --synthetic
          python validation/exploratory/real_pilot_6_text.py --out dry/text --synthetic
          if grep -n "EXCEPTION" dry/full/extract.log dry/parts/*/*.log dry/merged/real_pilot_6.log; then exit 1; fi
          grep -n "The owner's prediction\|| A8 |" dry/merged/real_pilot_6.log
      - name: The real inputs, checked (the earlier runs' files by their hashes; the Census's metadata), nothing computed on the data
        run: |
          bash validation/exploratory/real_pilot_5_inputs.sh "$RUNNER_TEMP/inputs" --no-geo-data
          "$RUNNER_TEMP/venv-select/bin/python" validation/exploratory/real_pilot_5_extract.py --data "$RUNNER_TEMP/inputs/data" --geo "$RUNNER_TEMP/inputs/geo" --out "$RUNNER_TEMP/census-check" --check-census

  check:
    if: github.event.action == 'labeled' && github.event.label.name == 'pilot-run-6'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: One run, one attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "the diagnostics run once: this is attempt $GITHUB_RUN_ATTEMPT"; exit 1; }
          if git ls-remote --exit-code "https://github.com/${{ github.repository }}.git" "refs/heads/$RESULTS_BRANCH" > /dev/null; then
            echo "$RESULTS_BRANCH exists: the diagnostics have run"; exit 1
          fi

  prepare:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: The inputs (the earlier runs' files by their hashes; GEO's records, without the matrices)
        run: |
          set -o pipefail
          mkdir -p inputs
          bash validation/exploratory/real_pilot_5_inputs.sh inputs --no-geo-data | tee inputs/inputs.log
          echo "PR head ${{ github.event.pull_request.head.sha }}; src/ git tree $(git rev-parse HEAD:src); workflow run ${{ github.run_id }}" >> inputs/inputs.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot6-inputs
          path: inputs
          if-no-files-found: error

  extract:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: v1's selection environment
        run: |
          python -m pip install -q pip==26.2.1
          pip install -q --no-deps -r validation/prereg/requirements-select.txt && pip check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot6-inputs
          path: inputs
      - name: The full set of genes for the cases' cells and case 1's metadata (the Census, release 2025-11-08)
        timeout-minutes: 230
        run: python validation/exploratory/real_pilot_6_extract.py --data inputs/data --out full
      - name: The selection's environment, as installed
        if: always()
        run: |
          mkdir -p full
          pip freeze > full/select-freeze.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pilot6-full
          path: full
          if-no-files-found: warn

  run:
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: [case2, case1m, case1, case3a, case3b, case3c]
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: v1's analysis environment and the engine of this head's src/
        run: |
          lscpu | grep -E "Model name|^Flags" | cut -c1-400
          echo "src/ git tree $(git rev-parse HEAD:src)"
          python -m pip install -q pip==26.2.1
          pip install -q --no-deps -r validation/prereg/requirements-panel.txt && pip check
          pip install -q --no-deps -e .
          python -c "import metric_autopsy as m, pathlib, sys; p = pathlib.Path(m.__file__).resolve(); print(m.__version__, p); sys.exit(0 if str(p).startswith(str(pathlib.Path('src').resolve())) else 1)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot6-inputs
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot6-full
          path: full
      - name: The part ${{ matrix.part }}
        timeout-minutes: 335
        run: python validation/exploratory/real_pilot_6.py --inputs inputs --full full --part "${{ matrix.part }}" --out "out/part-${{ matrix.part }}"
      - name: The analysis environment, as installed
        if: always()
        run: |
          mkdir -p "out/part-${{ matrix.part }}"
          pip freeze > "out/part-${{ matrix.part }}/panel-freeze.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pilot6-part-${{ matrix.part }}
          path: out
          if-no-files-found: warn

  text:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: What the TMS authors write (fetched, quoted; the texts not written)
        run: python -I validation/exploratory/real_pilot_6_text.py --out text
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pilot6-text
          path: text
          if-no-files-found: warn

  collect:
    needs: [prepare, extract, run, text]
    if: always() && needs.extract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: v1's analysis environment and the engine (the merge imports the analysis script)
        run: |
          python -m pip install -q pip==26.2.1
          pip install -q --no-deps -r validation/prereg/requirements-panel.txt && pip check
          pip install -q --no-deps -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot6-inputs
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot6-full
          path: full
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: pilot6-part-*
          path: parts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: pilot6-text
          path: text
      - name: Merge the parts (a part that is missing is recorded as missing)
        run: |
          mkdir -p parts merged
          python validation/exploratory/real_pilot_6.py --merge parts --out merged
      - name: Commit everything, as it is, to results/real-pilot-6 (a second start finds the branch and stops)
        if: always()
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$remote" "refs/heads/$RESULTS_BRANCH" > /dev/null; then
            echo "$RESULTS_BRANCH exists: nothing is pushed"; exit 1
          fi
          pub="$RUNNER_TEMP/pub"
          mkdir -p "$pub/inputs" "$pub/extract" "$pub/run/parts" "$pub/text"
          cp inputs/inputs.log inputs/run1-SHA256SUMS inputs/run2-SHA256SUMS "$pub/inputs/" || echo "missing: the inputs' log"
          for f in extract.log extract.json select-freeze.txt census_obs_case1.csv.gz source_obs_case1.csv.gz dataset_case1.json; do
            cp "full/$f" "$pub/extract/" || echo "missing: full/$f"
          done
          [ -d merged ] && cp -r merged/. "$pub/run/"
          for f in real_pilot_6_text.log real_pilot_6_text.json; do cp "text/$f" "$pub/text/" || echo "missing: text/$f"; done
          for d in parts/*; do if [ -d "$d" ]; then cp -r "$d" "$pub/run/parts/"; fi; done
          workflow_blob=$(git rev-parse "HEAD:.github/workflows/real-pilot-6.yml")
          {
            echo "# The fourth run of v0.4 on the development data (exploratory)"
            echo
            echo "- Workflow run ${{ github.run_id }} (attempt $GITHUB_RUN_ATTEMPT) of \`.github/workflows/real-pilot-6.yml\` (blob $workflow_blob), at the pull request's head ${{ github.event.pull_request.head.sha }}; the plan: \`validation/exploratory/real_pilot_6_plan.md\` there."
            echo "- The engine: v0.4.0.dev0, this head's src/ (git tree $(git rev-parse HEAD:src)), installed in v1's analysis environment."
            echo "- The jobs: prepare ${{ needs.prepare.result }}; text ${{ needs.text.result }}; extract ${{ needs.extract.result }}; run (the six parts) ${{ needs.run.result }}."
            echo "- The data: the second run's files on results/real-pilot-2 at bad785a3c56e9de1ee24737953c1b4b63112aa7c and the first run's case 3 on results/real-pilot at 6133dfdf4c05f083f012aaec4136e376715af05a (inputs/), not copied here; the full set of genes for their cells and case 1's metadata from the CELLxGENE Census, release 2025-11-08 (CC BY 4.0), the counts not copied here. extract/: the extraction's log and JSON, case 1's Census obs and its dataset's source obs."
            echo "- run/: real_pilot_6.log and real_pilot_6.json (every criterion and the owner's prediction scored as the plan fixes them, each claim's dossier), and each part's log, JSON and the engine's reports (parts/)."
            echo "- text/: what the TMS authors write, quoted (real_pilot_6_text.log and .json); the texts themselves are not copied (the author manuscript has no Creative Commons licence)."
          } > "$pub/README.md"
          cd "$pub"
          find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          for f in $(find . -type f -size +45000000c); do split -b 45000000 -d -a 2 "$f" "$f.part-" && rm "$f"; done
          git init -q -b "$RESULTS_BRANCH"
          git config user.name "metric-autopsy validation"
          git config user.email "validation@users.noreply.github.com"
          git add -A
          git commit -qm "The fourth run of v0.4 on the development data (workflow run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git push "$remote" "HEAD:refs/heads/$RESULTS_BRANCH" && break; sleep $((i * 10)); done
          test "$(git ls-remote "$remote" "refs/heads/$RESULTS_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "----- real_pilot_6.log (head) -----"
          head -60 run/real_pilot_6.log || true
