# The second diagnostics on the data of the pilot's second run, decided by the owner on 2026-10-17 and
# planned in validation/exploratory/real_pilot_diagnostics_2_plan.md before the run. Exploratory, on
# development data only: (v) the composition of cells on preprint section 4, from the second run's
# case1.npz; (ii′) specificity on the donor-level t, with the controls drawn from the full set of genes,
# which are read again from the CELLxGENE Census (release 2025-11-08) for the claims' cells.
#
# On every push to the pilot's pull request: the dry run. The pilot's and the diagnostics' tests; the
# whole path on a fabricated Census and fabricated STRING files; and the real inputs checked without
# any computation on them: the second run's files against its SHA256SUMS, STRING downloaded and parsed,
# and the Census opened at the release to count each case's measured genes (metadata only).
#
# The real run, once, started by the label "pilot-run-4" on the pull request:
# - check: the run's first attempt, and the branch results/real-pilot-4 must not exist;
# - prepare: the inputs (real_pilot_3_inputs.sh), to the artifact pilot4-inputs;
# - extract: the full set of genes for the claims' cells and the controls drawn by the plan's rule, in
#   v1's selection environment (requirements-select.txt), to the artifact pilot4-full;
# - run: the checks, in v1's analysis environment with the engine of the tag v0.3.0-prereg from a
#   worktree (its metrics and statistics only);
# - collect: once the extraction has succeeded, whatever the checks produced is committed to the new
#   branch results/real-pilot-4, failures included.
# A second start finds the branch and stops. If the preparation or the extraction fails, no check starts
# and nothing is committed: a fix and a second start are then recorded in the report.
name: Real-data pilot, second diagnostics on the second run's data (exploratory)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  FROZEN_TAG: v0.3.0-prereg
  SRC_TREE: 97cbab3c437c9ddb118a0690e6e0d24f8a16069f
  SRC_SHA256: 17e9a04f6fdd82e98606da89ad98cdce9a7f22fc35c1b31235efcb0637b132e8
  RESULTS_BRANCH: results/real-pilot-4
  # the numerical environment of v1's jobs (validation.yml)
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: Haswell
  NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
  PYTHONHASHSEED: "0"

jobs:
  dry:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: The engine of the tag from a worktree, src/ the tag's byte for byte
        run: |
          git fetch -q origin "refs/tags/$FROZEN_TAG:refs/tags/$FROZEN_TAG"
          git worktree add -q "$RUNNER_TEMP/engine" "$FROZEN_TAG"
          test "$(git -C "$RUNNER_TEMP/engine" rev-parse HEAD:src)" = "$SRC_TREE"
          sum=$(cd "$RUNNER_TEMP/engine" && find src -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          test "$sum" = "$SRC_SHA256" || { echo "src/ sha256 $sum, D1 records $SRC_SHA256"; exit 1; }
      - name: The two environments, the selection's and the analyses'
        run: |
          lscpu | grep -E "Model name|^Flags" | cut -c1-400
          python -m venv "$RUNNER_TEMP/venv-select"
          python -m venv "$RUNNER_TEMP/venv-panel"
          "$RUNNER_TEMP/venv-select/bin/python" -m pip install -q pip==26.2.1
          "$RUNNER_TEMP/venv-select/bin/pip" install -q --no-deps -r validation/prereg/requirements-select.txt
          "$RUNNER_TEMP/venv-select/bin/pip" check
          "$RUNNER_TEMP/venv-panel/bin/python" -m pip install -q pip==26.2.1
          "$RUNNER_TEMP/venv-panel/bin/pip" install -q --no-deps -r validation/prereg/requirements-panel.txt
          "$RUNNER_TEMP/venv-panel/bin/pip" install -q --no-deps pytest==9.1.1 pluggy==1.6.0 iniconfig==2.3.1 pygments==2.21.0
          "$RUNNER_TEMP/venv-panel/bin/pip" check
          "$RUNNER_TEMP/venv-panel/bin/pip" install -q --no-deps -e "$RUNNER_TEMP/engine"
          "$RUNNER_TEMP/venv-panel/bin/python" -c "import metric_autopsy as m, pathlib, sys; p = pathlib.Path(m.__file__).resolve(); print(m.__version__, p); sys.exit(0 if str(p).startswith(str(pathlib.Path('$RUNNER_TEMP/engine').resolve())) else 1)"
      - name: The pilot's and the diagnostics' tests
        run: |
          cd validation/exploratory
          "$RUNNER_TEMP/venv-panel/bin/python" -m pytest -q -p no:cacheprovider -c /dev/null test_real_pilot.py test_real_pilot_diagnostics.py test_real_pilot_4.py
      - name: The whole path on a fabricated Census and fabricated STRING files (SYNTHETIC)
        run: |
          sel="$RUNNER_TEMP/venv-select/bin/python"
          py="$RUNNER_TEMP/venv-panel/bin/python"
          "$sel" validation/exploratory/real_pilot_select.py --synthetic --second --out-dir dry/data
          "$py" validation/exploratory/real_pilot_diagnostics.py --data dry/data --out dry/string --fabricate-string dry/string
          "$sel" validation/exploratory/real_pilot_4_extract.py --data dry/data --string dry/string --out dry/full --synthetic --chunk 1000
          "$py" validation/exploratory/real_pilot_4.py --data dry/data --full dry/full --out dry/out
          if grep -n "EXCEPTION" dry/full/extract.log dry/out/real_pilot_4.log; then exit 1; fi
          grep -n "the prediction" dry/out/real_pilot_4.log
      - name: The real inputs, checked (the second run's files by their hashes; STRING downloaded and parsed; the Census's metadata), nothing computed on the data
        run: |
          bash validation/exploratory/real_pilot_3_inputs.sh "$RUNNER_TEMP/inputs"
          "$RUNNER_TEMP/venv-panel/bin/python" validation/exploratory/real_pilot_diagnostics.py --string "$RUNNER_TEMP/inputs/string" --out "$RUNNER_TEMP/string-stats" --string-stats
          (cd "$RUNNER_TEMP/inputs/string" && sha256sum ./*.gz) | tee "$RUNNER_TEMP/string.sha256"
          grep -q "ededc5cefddea16013c4d8f7d5a1080efea22d4b3f1f090c27019eb1d5209c08" "$RUNNER_TEMP/string.sha256"
          grep -q "803775e1d1a47864561e41944bf1f988094a836991e7cf13e4229233fc8cff3d" "$RUNNER_TEMP/string.sha256"
          "$RUNNER_TEMP/venv-select/bin/python" validation/exploratory/real_pilot_4_extract.py --data "$RUNNER_TEMP/inputs/data" --string "$RUNNER_TEMP/inputs/string" --out "$RUNNER_TEMP/census-check" --check-census

  check:
    if: github.event.action == 'labeled' && github.event.label.name == 'pilot-run-4'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: One run, one attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "the diagnostics run once: this is attempt $GITHUB_RUN_ATTEMPT"; exit 1; }
          if git ls-remote --exit-code "https://github.com/${{ github.repository }}.git" "refs/heads/$RESULTS_BRANCH" > /dev/null; then
            echo "$RESULTS_BRANCH exists: the diagnostics have run"; exit 1
          fi

  prepare:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: The inputs (the second run's files by their hashes; STRING v12.0 mouse)
        run: |
          set -o pipefail
          mkdir -p inputs
          bash validation/exploratory/real_pilot_3_inputs.sh inputs | tee inputs/inputs.log
          echo "PR head ${{ github.event.pull_request.head.sha }}; workflow run ${{ github.run_id }}" >> inputs/inputs.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot4-inputs
          path: inputs
          if-no-files-found: error

  extract:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: v1's selection environment
        run: |
          python -m pip install -q pip==26.2.1
          pip install -q --no-deps -r validation/prereg/requirements-select.txt && pip check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot4-inputs
          path: inputs
      - name: The full set of genes for the claims' cells, and the controls (the Census, release 2025-11-08)
        timeout-minutes: 170
        run: python validation/exploratory/real_pilot_4_extract.py --data inputs/data --string inputs/string --out full
      - name: The selection's environment, as installed
        if: always()
        run: |
          mkdir -p full
          pip freeze > full/select-freeze.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pilot4-full
          path: full
          if-no-files-found: warn

  run:
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: The engine of the tag from a worktree, src/ the tag's byte for byte
        run: |
          git fetch -q origin "refs/tags/$FROZEN_TAG:refs/tags/$FROZEN_TAG"
          git worktree add -q "$RUNNER_TEMP/engine" "$FROZEN_TAG"
          test "$(git -C "$RUNNER_TEMP/engine" rev-parse HEAD:src)" = "$SRC_TREE"
          sum=$(cd "$RUNNER_TEMP/engine" && find src -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          test "$sum" = "$SRC_SHA256" || { echo "src/ sha256 $sum, D1 records $SRC_SHA256"; exit 1; }
      - name: v1's analysis environment and the engine
        run: |
          lscpu | grep -E "Model name|^Flags" | cut -c1-400
          python -m pip install -q pip==26.2.1
          pip install -q --no-deps -r validation/prereg/requirements-panel.txt && pip check
          pip install -q --no-deps -e "$RUNNER_TEMP/engine"
          python -c "import metric_autopsy as m, pathlib, sys; p = pathlib.Path(m.__file__).resolve(); print(m.__version__, p); sys.exit(0 if str(p).startswith(str(pathlib.Path('$RUNNER_TEMP/engine').resolve())) else 1)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot4-inputs
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot4-full
          path: full
      - name: The checks (v) and (ii′)
        timeout-minutes: 100
        run: python validation/exploratory/real_pilot_4.py --data inputs/data --full full --run2 inputs/data/real_pilot.json --out out
      - name: The analysis environment, as installed
        if: always()
        run: |
          mkdir -p out
          pip freeze > out/panel-freeze.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pilot4-out
          path: out
          if-no-files-found: warn

  collect:
    needs: [prepare, extract, run]
    if: always() && needs.extract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: One attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot4-inputs
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot4-full
          path: full
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: pilot4-out
          path: out
      - name: Commit everything, as it is, to results/real-pilot-4 (a second start finds the branch and stops)
        if: always()
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$remote" "refs/heads/$RESULTS_BRANCH" > /dev/null; then
            echo "$RESULTS_BRANCH exists: nothing is pushed"; exit 1
          fi
          pub="$RUNNER_TEMP/pub"
          mkdir -p "$pub/inputs" "$pub/full" "$pub/run"
          cp inputs/inputs.log inputs/run2-SHA256SUMS "$pub/inputs/" || echo "missing: the inputs' log"
          [ -d full ] && cp -r full/. "$pub/full/"
          [ -d out ] && cp -r out/. "$pub/run/"
          workflow_blob=$(git rev-parse "HEAD:.github/workflows/real-pilot-4.yml")
          {
            echo "# The pilot's second diagnostics on the second run's data (exploratory, development data)"
            echo
            echo "- Workflow run ${{ github.run_id }} (attempt $GITHUB_RUN_ATTEMPT) of \`.github/workflows/real-pilot-4.yml\` (blob $workflow_blob), at the pull request's head ${{ github.event.pull_request.head.sha }}; the plan: \`validation/exploratory/real_pilot_diagnostics_2_plan.md\` there."
            echo "- The engine: the tag $FROZEN_TAG, src/ git tree $SRC_TREE, installed from a worktree; its metrics and statistics only."
            echo "- The jobs: prepare ${{ needs.prepare.result }}; extract ${{ needs.extract.result }}; run ${{ needs.run.result }}."
            echo "- The data: the second run's files on results/real-pilot-2 at bad785a3c56e9de1ee24737953c1b4b63112aa7c (inputs/inputs.log), not copied here; for check (ii′), the full set of genes for the claims' cells read again from the CELLxGENE Census, release 2025-11-08 (CC BY 4.0): full/ holds the claim genes' and the controls' columns, every gene's mean and detection, the selection and the extraction's log (files over 45 MB split into .part-NN). STRING v12.0 (CC BY 4.0), mouse, as in the first diagnostics; not copied here."
            echo "- run/: real_pilot_4.log and real_pilot_4.json: the checks (v) and (ii′), their outcomes and the owner's predictions scored."
          } > "$pub/README.md"
          cd "$pub"
          find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          for f in full/*.npz; do
            [ -f "$f" ] || continue
            if [ "$(stat -c %s "$f")" -gt 45000000 ]; then split -b 45000000 -d -a 2 "$f" "$f.part-" && rm "$f"; fi
          done
          git init -q -b "$RESULTS_BRANCH"
          git config user.name "metric-autopsy validation"
          git config user.email "validation@users.noreply.github.com"
          git add -A
          git commit -qm "The pilot's second diagnostics on the second run's data (workflow run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git push "$remote" "HEAD:refs/heads/$RESULTS_BRANCH" && break; sleep $((i * 10)); done
          test "$(git ls-remote "$remote" "refs/heads/$RESULTS_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "----- real_pilot_4.log -----"
          cat run/real_pilot_4.log || true
