# Anchor R1, once, with the loader fixed by DEVIATIONS.md D1: after the results, outside v1.
#
# In v1's run (workflow run 37990113304) R1 did not run: anchors._load handed B2's sparse matrix to
# SimpleData (src/metric_autopsy/core.py:122, ValueError). D1 changes only the loading in
# anchors.py. This workflow builds the run commit: the frozen tag v0.3.0-prereg plus three files of
# the pull request's head (anchors.py, test_anchors.py, DEVIATIONS.md). It does not add this
# workflow: GITHUB_TOKEN cannot push a commit that adds a workflow, so the workflow's own blob is
# recorded instead. The test job runs D1's test on synthetic sparse backgrounds. The R1 job then:
# - checks that the run commit differs from the tag in those files only, and that src/ is the
#   tag's byte for byte (the git tree and the sha256 recorded in D1);
# - installs v1's pinned environment and the engine from that commit;
# - runs R1 alone on B2, the backgrounds-data artifact of v1's run, which the run tag's
#   backgrounds.json checks by its sha256;
# - pushes the run commit and the result (r1/), whatever it is, to the new branch results/panel-v1-r1.
# One run: both jobs stop if that branch exists or on a re-run attempt. If R1 fails again, it is
# not fixed without the owner's decision (D1). Started by the label "r1-run" on the pull request.
name: Anchor R1 (D1, outside v1)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  FROZEN_TAG: v0.3.0-prereg
  RUN_TAG: panel-v1-run
  RESULTS_BRANCH: results/panel-v1-r1
  V1_RUN_ID: "37990113304"
  D1_FILES: "validation/prereg/DEVIATIONS.md validation/prereg/anchors.py validation/prereg/test_anchors.py"
  SRC_TREE: 97cbab3c437c9ddb118a0690e6e0d24f8a16069f
  SRC_SHA256: 17e9a04f6fdd82e98606da89ad98cdce9a7f22fc35c1b31235efcb0637b132e8
  # the numerical environment of v1's jobs (validation.yml)
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: Haswell
  NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
  PYTHONHASHSEED: "0"

jobs:
  test:
    if: github.event.label.name == 'r1-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: One run, one attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "R1 runs once: this is attempt $GITHUB_RUN_ATTEMPT"; exit 1; }
          if git ls-remote --exit-code origin "refs/heads/$RESULTS_BRANCH" > /dev/null; then
            echo "$RESULTS_BRANCH exists: R1 has run"; exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: v1's pinned environment, the engine, and pytest for the test
        run: |
          python -m pip install pip==26.2.1
          pip install --no-deps -r validation/prereg/requirements-panel.txt
          pip install --no-deps pytest==9.1.1 pluggy==1.6.0 iniconfig==2.3.1 pygments==2.21.0 && pip check
          pip install --no-deps -e .
      - name: D1's test (synthetic sparse backgrounds only)
        run: python -m pytest -q -p no:cacheprovider validation/prereg/test_anchors.py

  r1:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: One run, one attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "R1 runs once: this is attempt $GITHUB_RUN_ATTEMPT"; exit 1; }
          if git ls-remote --exit-code origin "refs/heads/$RESULTS_BRANCH" > /dev/null; then
            echo "$RESULTS_BRANCH exists: R1 has run"; exit 1
          fi
      - name: The run commit - the tag and D1's files, src/ the tag's byte for byte
        run: |
          head=$(git rev-parse HEAD)
          workflow_blob=$(git rev-parse "$head:.github/workflows/anchors-r1.yml")
          git fetch -q origin "refs/tags/$FROZEN_TAG:refs/tags/$FROZEN_TAG" "refs/tags/$RUN_TAG:refs/tags/$RUN_TAG"
          git checkout -q --detach "$FROZEN_TAG^{commit}"
          git checkout -q "$head" -- $D1_FILES
          git config user.name "metric-autopsy validation"
          git config user.email "validation@users.noreply.github.com"
          git commit -qm "Anchor R1's run commit: $FROZEN_TAG with D1's files from $head (DEVIATIONS.md D1)"
          changed=$(git diff --name-only "$FROZEN_TAG" HEAD | LC_ALL=C sort | tr '\n' ' ')
          want=$(printf '%s\n' $D1_FILES | LC_ALL=C sort | tr '\n' ' ')
          test "$changed" = "$want" || { echo "the run commit differs from the tag in: $changed"; exit 1; }
          git diff --quiet "$FROZEN_TAG" HEAD -- src  # as frozen.py checks the frozen paths
          test "$(git rev-parse HEAD:src)" = "$SRC_TREE"
          sum=$(find src -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          test "$sum" = "$SRC_SHA256" || { echo "src/ sha256 $sum, D1 records $SRC_SHA256"; exit 1; }
          git show "$RUN_TAG:validation/prereg/backgrounds.json" > "$RUNNER_TEMP/backgrounds.json"
          { echo "RUN_COMMIT=$(git rev-parse HEAD)"; echo "PR_HEAD=$head"; echo "WORKFLOW_BLOB=$workflow_blob"; } >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: v1's pinned environment and the engine from the run commit
        run: |
          python -m pip install pip==26.2.1
          pip install --no-deps -r validation/prereg/requirements-panel.txt && pip check
          pip install --no-deps -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backgrounds-data
          path: data
          run-id: ${{ env.V1_RUN_ID }}
          github-token: ${{ github.token }}
      - name: R1 alone, with the frozen engine
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python - "$RUNNER_TEMP/backgrounds.json" data "$RUNNER_TEMP/out" <<'EOF'
          import json, sys, traceback
          from pathlib import Path
          sys.path.insert(0, "validation/prereg")
          import anchors  # sets the numerical environment before numpy loads, as anchors.main
          spec, data, out = Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3])
          try:
              res = anchors.r1(spec, data)
          except Exception as exc:  # reported as it is, not fixed (D1)
              res = [dict(claim="R1", error=repr(exc), traceback=traceback.format_exc().splitlines())]
          (out / "anchors_r1.json").write_text(json.dumps(res, indent=1, default=str))
          lines = ["# Anchor R1 (DEVIATIONS.md D1: after the results, outside v1)", "",
                   "| Claim | Verdict | Cause | Allowed | In allowed |", "|---|---|---|---|---|"]
          for r in res:
              lines.append(f"| {r['claim']} | {r.get('verdict', r.get('error', r.get('skipped', '')))} | {r.get('cause', '')} | "
                           f"{', '.join(r.get('allowed', []))} | {r.get('in_allowed', '')} |")
          (out / "anchors_r1.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          EOF
      - name: The run commit and the result, as they are, to results/panel-v1-r1
        run: |
          mkdir r1 && cp "$RUNNER_TEMP/out/anchors_r1.json" "$RUNNER_TEMP/out/anchors_r1.md" r1/
          b2=$(python -c "import json; print(json.load(open('$RUNNER_TEMP/backgrounds.json'))['B2']['sha256'])")
          {
            echo "# Anchor R1, run once with D1's loader (after the results, outside v1)"
            echo
            echo "- Workflow run ${{ github.run_id }} (attempt $GITHUB_RUN_ATTEMPT) of \`.github/workflows/anchors-r1.yml\`, blob $WORKFLOW_BLOB, from the pull request's head $PR_HEAD."
            echo "- Run commit $RUN_COMMIT (this branch's parent commit): the tag $FROZEN_TAG plus D1's files ($D1_FILES)."
            echo "- src/ is the tag's: git tree $SRC_TREE, sha256 of its files' sha256 list $SRC_SHA256."
            echo "- B2: the backgrounds-data artifact of v1's workflow run $V1_RUN_ID, sha256 $b2 (the run tag $RUN_TAG's backgrounds.json)."
            echo "- v1's results stay as published on results/panel-v1, with R1 \"did not run\"."
          } > r1/README.md
          git add -f r1/anchors_r1.json r1/anchors_r1.md r1/README.md
          git commit -qm "Anchor R1 with D1's loader (workflow run ${{ github.run_id }})"
          git push origin "HEAD:refs/heads/$RESULTS_BRANCH"
          test "$(git ls-remote origin "refs/heads/$RESULTS_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
