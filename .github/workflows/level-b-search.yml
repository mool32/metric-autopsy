# Level B's search for claims, by validation/plans/level_b_protocol.md (approved by the owner on 2026-10-19,
# the second decisions of that day): validation/level_b/search.py. This environment reaches neither PubMed nor
# Europe PMC; the runs reach them here. Nothing of the engine runs on level B.
#
# On every push to the pull request: the dry run. The search's tests, then the lookup and the search on
# fabricated responses (validation/level_b/fabricated.py): nothing is fetched.
#
# The lookup, by the label "level-b-lookup": the method papers whose forward citations are searched, each found
# in Europe PMC by its query and checked against method_papers.json. Verified, its records go to the new branch
# results/level-b-lookup; not verified, the job fails before any search and its log shows the records found, so
# that method_papers.json can be corrected. The search refuses to run until method_papers.json records every
# paper as verified (committed after the lookup).
#
# The search, once, by the label "level-b-search": PubMed, Europe PMC and the forward citations, every raw
# response as it came, the merged list and the sample for screening, with SHA256SUMS, to the new branch
# results/level-b-search. A second start finds the branch and stops; if the search fails nothing is committed,
# and a fix and a second start are recorded in the report (the protocol, section 2).
#
# The full texts, once, by the label "level-b-fulltext", after the screening of titles and abstracts: Europe
# PMC's open-access full text of every record in validation/level_b/fulltext_list.tsv (committed from the two
# passes' decisions before the run), as it came, with an index of what was tried and found, to the new branch
# results/level-b-fulltext.
#
# Amendment 1 (the protocol's section 12, the owner's decisions of 2026-11-10; validation/level_b/plan_s1.md),
# each once, its plan committed before it runs:
# - by the label "level-b-fetch2": Europe PMC asked again for three full texts, one attempt at an open full text
#   at the publisher for six records, and two records' repositories checked for public counts
#   (validation/level_b/fetch2_list.tsv), every response as it came, to results/level-b-fetch2;
# - by the label "level-b-preprints": Europe PMC's preprints for the section 3 terms and window without the
#   language filter, every page as it came and the parsed records, to results/level-b-preprints.
# - by the label "level-b-fulltext2" (S3, validation/level_b/plan_s3.md): the full texts of
#   validation/level_b/amendment1/fulltext_list.tsv from Europe PMC as the first fetch, then one attempt at the
#   publisher for those without one that have a DOI (the owner's rule for A's records), to results/level-b-fulltext2.
# - by the label "level-b-verdicts" (S4, validation/level_b/plan_s4.md): the search for each kept claim's
#   independent verdict (validation/level_b/verdicts.py on amendment1/kept_claims.json), to results/level-b-verdicts.
# - by the label "level-b-publisher2" (S3; validation/level_b/JOURNAL.md, J18): the one attempt at the publisher
#   again, paced, for the records bioRxiv refused for the requests' rate (HTTP 429) in the fetch of
#   "level-b-fulltext2" (validation/level_b/amendment1/publisher_again.tsv), to results/level-b-publisher2.
# - by the label "level-b-setgenes" (validation/level_b/plan_s5.md, section 5): Europe PMC's supplementary files of
#   every kept paper with a set's claim (validation/level_b/set_genes.py fetch on amendment1/kept_claims.json), and
#   each archive's members and tables' first rows (show), to results/level-b-setgenes.
name: Level B's search for claims

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  dry:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: v1's analysis environment (its numpy draws the sample)
        run: |
          python -m pip install -q pip==26.2.1
          pip install -q --no-deps -r validation/prereg/requirements-panel.txt && pip check
          pip install -q --no-deps pytest==9.1.1 pluggy==1.6.0 iniconfig==2.3.1 pygments==2.21.0
      - name: The search's and the screening's tests
        run: python -m pytest -q -p no:cacheprovider -c /dev/null validation/level_b/test_search.py validation/level_b/test_screening.py validation/level_b/test_data_checks.py validation/level_b/test_verdicts.py validation/level_b/test_data_run.py validation/level_b/test_independence.py validation/level_b/test_kept.py validation/level_b/test_set_genes.py validation/level_b/test_list_s7.py
      - name: The lookup and the search on fabricated responses (FABRICATED, nothing fetched)
        run: |
          python -I validation/level_b/search.py lookup --out dry/lookup --fabricated
          python -I validation/level_b/search.py search --out dry/search --fabricated --papers dry/lookup/method_papers.verified.json
          grep -v "^  window" dry/search/search.log
      - name: The search rebuilt from its own recorded responses (remerge, nothing fetched)
        run: |
          python -I validation/level_b/search.py remerge --search dry/search --out dry/remerge --papers dry/lookup/method_papers.verified.json > /dev/null
          cmp <(zcat dry/search/records.jsonl.gz) <(zcat dry/remerge/records.jsonl.gz)
          cmp dry/search/sample.txt dry/remerge/sample.txt
          tail -3 dry/remerge/remerge.log
      - name: The full texts on fabricated responses (FABRICATED, nothing fetched)
        run: |
          python -I -c "import gzip, json; rs = [json.loads(x) for x in gzip.open('dry/search/records.jsonl.gz', 'rt')]; open('dry/rids.txt', 'w').write('\n'.join(r['rid'] for r in rs[:60]) + '\n')"
          python -I validation/level_b/screening.py fulltext-list --search dry/search --rids dry/rids.txt --out dry/fulltext_list.tsv
          python -I validation/level_b/search.py fulltext --out dry/fulltext --fabricated --list dry/fulltext_list.tsv
          python -I validation/level_b/screening.py fulltext-text --fulltext dry/fulltext --out dry/fulltext-text
      - name: Amendment 1's second fetch and preprints on fabricated responses (FABRICATED, nothing fetched)
        run: |
          python -I validation/level_b/search.py fetch2 --out dry/fetch2 --fabricated
          python -I validation/level_b/search.py preprints --out dry/preprints --fabricated
      - name: S3's full texts on fabricated responses, then one attempt at the publisher for those without (FABRICATED)
        run: |
          python -I validation/level_b/screening.py publisher-list --index dry/fulltext/fulltext_index.tsv --list dry/fulltext_list.tsv --out dry/publisher_list.tsv
          python -I validation/level_b/search.py fetch2 --out dry/fulltext/publisher --fabricated --fetch2-list dry/publisher_list.tsv
          tail -4 dry/fulltext/publisher/fetch2.log
      - name: S4's search for the independent verdicts on fabricated answers (FABRICATED, nothing fetched)
        run: |
          python -I -c "import json; json.dump(dict(papers=[dict(rid='R00189', pmid='12345612', pmcid='', doi='10.1/x', epmc_ids=[], claims=[dict(id='c1', kind='pair', genes=['ACE2', 'TMPRSS2'])])]), open('dry/kept.json', 'w'))"
          python -I validation/level_b/verdicts.py --claims dry/kept.json --out dry/verdicts --fabricated
      - name: The sets' genes on fabricated answers (FABRICATED, nothing fetched)
        run: |
          python -I validation/level_b/set_genes.py dry --out dry/setgenes
          tail -2 dry/setgenes/setgenes.log

  lookup:
    if: github.event.action == 'labeled' && github.event.label.name == 'level-b-lookup'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: One attempt; the branch results/level-b-lookup must not exist
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "attempt $GITHUB_RUN_ATTEMPT"; exit 1; }
          if git ls-remote --exit-code "https://github.com/${{ github.repository }}.git" refs/heads/results/level-b-lookup > /dev/null; then
            echo "results/level-b-lookup exists: the lookup has run"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: The method papers in Europe PMC, checked against method_papers.json
        run: python -I validation/level_b/search.py lookup --out lookup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: level-b-lookup
          path: lookup
          if-no-files-found: error

  publish-lookup:
    needs: lookup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: level-b-lookup
          path: pub
      - name: To results/level-b-lookup, with SHA256SUMS
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cd pub
          {
            echo "# Level B: the lookup of the method papers"
            echo
            echo "Workflow run ${{ github.run_id }} of .github/workflows/level-b-search.yml at the pull request's head ${{ github.event.pull_request.head.sha }}: validation/level_b/search.py lookup, against validation/level_b/method_papers.json there. lookup.log and lookup.json: each paper's query, the records found, the one that matches; raw/: Europe PMC's responses as they came."
          } > README.md
          find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          git init -q -b results/level-b-lookup
          git config user.name "metric-autopsy validation"
          git config user.email "validation@users.noreply.github.com"
          git add -A
          git commit -qm "Level B: the lookup of the method papers (workflow run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git push "$remote" HEAD:refs/heads/results/level-b-lookup && break; sleep $((i * 10)); done
          test "$(git ls-remote "$remote" refs/heads/results/level-b-lookup | cut -f1)" = "$(git rev-parse HEAD)"

  search:
    if: github.event.action == 'labeled' && github.event.label.name == 'level-b-search'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: One run, one attempt; the branch results/level-b-search must not exist
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "the search runs once: this is attempt $GITHUB_RUN_ATTEMPT"; exit 1; }
          if git ls-remote --exit-code "https://github.com/${{ github.repository }}.git" refs/heads/results/level-b-search > /dev/null; then
            echo "results/level-b-search exists: the search has run"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: v1's analysis environment (its numpy draws the sample)
        run: |
          python -m pip install -q pip==26.2.1
          pip install -q --no-deps -r validation/prereg/requirements-panel.txt && pip check
      - name: The search (PubMed, Europe PMC, the forward citations)
        timeout-minutes: 110
        run: python -I validation/level_b/search.py search --out search
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: level-b-search
          path: search
          if-no-files-found: error

  publish-search:
    needs: search
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: level-b-search
          path: pub
      - name: To results/level-b-search, with SHA256SUMS (a second start finds the branch and stops)
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$remote" refs/heads/results/level-b-search > /dev/null; then
            echo "results/level-b-search exists: nothing is pushed"; exit 1
          fi
          cp repo/validation/level_b/method_papers.json pub/method_papers.json
          blob=$(git -C repo rev-parse HEAD:validation/level_b/search.py)
          cd pub
          {
            echo "# Level B: the search for claims"
            echo
            echo "- Workflow run ${{ github.run_id }} of .github/workflows/level-b-search.yml at the pull request's head ${{ github.event.pull_request.head.sha }}; validation/level_b/search.py (blob $blob) by validation/plans/level_b_protocol.md there (approved by the owner on 2026-10-19)."
            echo "- search.log and search.json: the queries, each source's counts, the merged list and the sample; requests.tsv: every request (its URL, parameters, status, size and SHA256)."
            echo "- raw/: every response as it came (gzip): PubMed's esearch by date window and efetch by PMID, Europe PMC's search pages, each method paper's citations and its citing records' core records."
            echo "- records.jsonl.gz: the merged records, numbered (rid), each with every source that found it; sample.txt: the rids the screening reads (all of them, or 5,000 drawn with the protocol's seed)."
            echo "- method_papers.json: the method papers as verified by the lookup (results/level-b-lookup)."
          } > README.md
          find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          for f in $(find . -type f -size +45000000c); do split -b 45000000 -d -a 2 "$f" "$f.part-" && rm "$f"; done
          git init -q -b results/level-b-search
          git config user.name "metric-autopsy validation"
          git config user.email "validation@users.noreply.github.com"
          git add -A
          git commit -qm "Level B: the search for claims (workflow run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git push "$remote" HEAD:refs/heads/results/level-b-search && break; sleep $((i * 10)); done
          test "$(git ls-remote "$remote" refs/heads/results/level-b-search | cut -f1)" = "$(git rev-parse HEAD)"
          grep -v "^  window" search.log | head -80

  fulltext:
    if: github.event.action == 'labeled' && github.event.label.name == 'level-b-fulltext'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: One run, one attempt; the branch results/level-b-fulltext must not exist
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "the full texts are fetched once: this is attempt $GITHUB_RUN_ATTEMPT"; exit 1; }
          if git ls-remote --exit-code "https://github.com/${{ github.repository }}.git" refs/heads/results/level-b-fulltext > /dev/null; then
            echo "results/level-b-fulltext exists: the full texts have been fetched"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: The full texts of validation/level_b/fulltext_list.tsv (Europe PMC, open access)
        timeout-minutes: 50
        run: python -I validation/level_b/search.py fulltext --out fulltext
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: level-b-fulltext
          path: fulltext
          if-no-files-found: error

  publish-fulltext:
    needs: fulltext
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: level-b-fulltext
          path: pub
      - name: To results/level-b-fulltext, with SHA256SUMS (a second start finds the branch and stops)
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$remote" refs/heads/results/level-b-fulltext > /dev/null; then
            echo "results/level-b-fulltext exists: nothing is pushed"; exit 1
          fi
          cp repo/validation/level_b/fulltext_list.tsv pub/fulltext_list.tsv
          blob=$(git -C repo rev-parse HEAD:validation/level_b/search.py)
          cd pub
          {
            echo "# Level B: the full texts of the records kept or unclear after the screening of titles and abstracts"
            echo
            echo "- Workflow run ${{ github.run_id }} of .github/workflows/level-b-search.yml at the pull request's head ${{ github.event.pull_request.head.sha }}; validation/level_b/search.py (blob $blob) fulltext, on fulltext_list.tsv (the records either pass kept or marked unclear)."
            echo "- fulltext.log and fulltext.json: the counts; fulltext_index.tsv: per record the ids tried, the one fetched and its file, or why none; requests.tsv: every request."
            echo "- raw/fulltext/: each full text as it came (JATS XML, gzip), and the core records asked for the records without a PMCID."
          } > README.md
          find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          for f in $(find . -type f -size +45000000c); do split -b 45000000 -d -a 2 "$f" "$f.part-" && rm "$f"; done
          git init -q -b results/level-b-fulltext
          git config user.name "metric-autopsy validation"
          git config user.email "validation@users.noreply.github.com"
          git add -A
          git commit -qm "Level B: the full texts (workflow run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git push "$remote" HEAD:refs/heads/results/level-b-fulltext && break; sleep $((i * 10)); done
          test "$(git ls-remote "$remote" refs/heads/results/level-b-fulltext | cut -f1)" = "$(git rev-parse HEAD)"
          cat fulltext.log

  fetch2:
    if: github.event.action == 'labeled' && github.event.label.name == 'level-b-fetch2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: One run, one attempt; the branch results/level-b-fetch2 must not exist
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "this step runs once: this is attempt $GITHUB_RUN_ATTEMPT"; exit 1; }
          if git ls-remote --exit-code "https://github.com/${{ github.repository }}.git" refs/heads/results/level-b-fetch2 > /dev/null; then
            echo "results/level-b-fetch2 exists: this step has run"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: The run
        timeout-minutes: 50
        run: python -I validation/level_b/search.py fetch2 --out out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: level-b-fetch2
          path: out
          if-no-files-found: error

  publish-fetch2:
    needs: fetch2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: level-b-fetch2
          path: pub
      - name: To results/level-b-fetch2, with SHA256SUMS (a second start finds the branch and stops)
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$remote" refs/heads/results/level-b-fetch2 > /dev/null; then
            echo "results/level-b-fetch2 exists: nothing is pushed"; exit 1
          fi
          cp repo/validation/level_b/fetch2_list.tsv pub/fetch2_list.tsv
          blob=$(git -C repo rev-parse HEAD:validation/level_b/search.py)
          plan=$(git -C repo rev-parse HEAD:validation/level_b/plan_s1.md)
          cd pub
          {
            echo "# Level B, amendment 1: the second fetch (the owner's decisions of 2026-11-10, JOURNAL.md J1)"
            echo
            echo "- Workflow run ${{ github.run_id }} of .github/workflows/level-b-search.yml at the pull request's head ${{ github.event.pull_request.head.sha }}; validation/level_b/search.py (blob $blob) fetch2 on fetch2_list.tsv; the plan validation/level_b/plan_s1.md (blob $plan), committed before the run."
            echo "- fetch2.log and fetch2.json: the counts; fetch2_index.tsv: per request the record, the action, what was asked, the status, the final URL, the file; requests.tsv: every request."
            echo "- raw/fetch2/: every response as it came (gzip)."
          } > README.md
          find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          for f in $(find . -type f -size +45000000c); do split -b 45000000 -d -a 2 "$f" "$f.part-" && rm "$f"; done
          git init -q -b results/level-b-fetch2
          git config user.name "metric-autopsy validation"
          git config user.email "validation@users.noreply.github.com"
          git add -A
          git commit -qm "Level B, amendment 1: fetch2 (workflow run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git push "$remote" HEAD:refs/heads/results/level-b-fetch2 && break; sleep $((i * 10)); done
          test "$(git ls-remote "$remote" refs/heads/results/level-b-fetch2 | cut -f1)" = "$(git rev-parse HEAD)"
          cat *.log

  preprints:
    if: github.event.action == 'labeled' && github.event.label.name == 'level-b-preprints'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: One run, one attempt; the branch results/level-b-preprints must not exist
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "this step runs once: this is attempt $GITHUB_RUN_ATTEMPT"; exit 1; }
          if git ls-remote --exit-code "https://github.com/${{ github.repository }}.git" refs/heads/results/level-b-preprints > /dev/null; then
            echo "results/level-b-preprints exists: this step has run"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: The run
        timeout-minutes: 50
        run: python -I validation/level_b/search.py preprints --out out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: level-b-preprints
          path: out
          if-no-files-found: error

  publish-preprints:
    needs: preprints
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
