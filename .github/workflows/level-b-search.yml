          path: pub
      - name: To results/level-b-preprints, with SHA256SUMS (a second start finds the branch and stops)
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$remote" refs/heads/results/level-b-preprints > /dev/null; then
            echo "results/level-b-preprints exists: nothing is pushed"; exit 1
          fi
          blob=$(git -C repo rev-parse HEAD:validation/level_b/search.py)
          plan=$(git -C repo rev-parse HEAD:validation/level_b/plan_s1.md)
          cd pub
          {
            echo "# Level B, amendment 1: Europe PMC's preprints (12.2)"
            echo
            echo "- Workflow run ${{ github.run_id }} of .github/workflows/level-b-search.yml at the pull request's head ${{ github.event.pull_request.head.sha }}; validation/level_b/search.py (blob $blob) preprints; the plan validation/level_b/plan_s1.md (blob $plan), committed before the run."
            echo "- preprints.log and preprints.json: the query and the counts; preprints.jsonl.gz: the parsed records in the order fetched; requests.tsv: every request."
            echo "- raw/preprints/: every page as it came (gzip). The merge with the list is a later step (plan_s1.md)."
          } > README.md
          find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          for f in $(find . -type f -size +45000000c); do split -b 45000000 -d -a 2 "$f" "$f.part-" && rm "$f"; done
          git init -q -b results/level-b-preprints
          git config user.name "metric-autopsy validation"
          git config user.email "validation@users.noreply.github.com"
          git add -A
          git commit -qm "Level B, amendment 1: preprints (workflow run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git push "$remote" HEAD:refs/heads/results/level-b-preprints && break; sleep $((i * 10)); done
          test "$(git ls-remote "$remote" refs/heads/results/level-b-preprints | cut -f1)" = "$(git rev-parse HEAD)"
          cat *.log

