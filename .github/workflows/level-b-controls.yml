# Level B, step S6: the controls (validation/level_b/plan_s6.md, committed before any selection;
# validation/level_b/controls.py). This environment does not read the CELLxGENE Census; the run reads it here.
# Nothing of the engine runs: the rules count cells and detections, the negative controls' claims come from v1's
# rule of pairs (validation/prereg/panel.py, unchanged), the positive control's from its fixed genes.
#
# On every push to the pull request: the dry run. The controls' tests, then the selection on a fabricated Census
# and fabricated GEO files (SYNTHETIC): nothing is fetched.
#
# The selection, once, by the label "level-b-controls": the negative controls from the Census's stable release
# and the positive control (Kang et al. 2018, GEO GSE96583) fetched from GEO, in v1's selection environment
# (validation/prereg/requirements-select.txt). Its log, tables and claims, with SHA256SUMS, to the new branch
# results/level-b-controls; the extractions (npz) to the run's artifact "level-b-controls-data" (90 days; their
# SHA256 and the cells' joinids are on the branch). A second start finds the branch and stops; a second run only
# after a technical failure, recorded in validation/level_b/JOURNAL.md.
name: Level B's controls

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  dry:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: v1's selection environment
        run: |
          python -m pip install -q pip==26.2.1
          pip install -q --no-deps -r validation/prereg/requirements-select.txt && pip check
          pip install -q --no-deps -e .
          pip install -q --no-deps pytest==9.1.1 pluggy==1.6.0 iniconfig==2.3.1 pygments==2.21.0
      - name: The controls' tests
        run: python -m pytest -q -p no:cacheprovider validation/level_b/test_controls.py
      - name: The selection on a fabricated Census and fabricated GEO files (SYNTHETIC, nothing fetched)
        run: python -I validation/level_b/controls.py --out dry --synthetic

  controls:
    if: github.event.action == 'labeled' && github.event.label.name == 'level-b-controls'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: One run, one attempt; the branch results/level-b-controls must not exist
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "this step runs once: this is attempt $GITHUB_RUN_ATTEMPT"; exit 1; }
          if git ls-remote --exit-code "https://github.com/${{ github.repository }}.git" refs/heads/results/level-b-controls > /dev/null; then
            echo "results/level-b-controls exists: this step has run"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: v1's selection environment
        run: |
          python -m pip install -q pip==26.2.1
          pip install -q --no-deps -r validation/prereg/requirements-select.txt && pip check
      - name: The selection
        timeout-minutes: 220
        run: |
          python -I validation/level_b/controls.py --out out
          { echo; echo '## Environment'; echo; echo '```'; pip freeze; echo '```'; } >> out/controls.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: level-b-controls-data
          path: out/data
          if-no-files-found: error
          retention-days: 90
      - name: Everything but the extractions, for the branch
        run: rm -rf out/data
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: level-b-controls
          path: out
          if-no-files-found: error

  publish-controls:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: level-b-controls
          path: pub
      - name: To results/level-b-controls, with SHA256SUMS (a second start finds the branch and stops)
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$remote" refs/heads/results/level-b-controls > /dev/null; then
            echo "results/level-b-controls exists: nothing is pushed"; exit 1
          fi
          blob=$(git -C repo rev-parse HEAD:validation/level_b/controls.py)
          plan=$(git -C repo rev-parse HEAD:validation/level_b/plan_s6.md)
          cd pub
          {
            echo "# Level B, S6: the controls"
            echo
            echo "- Workflow run ${{ github.run_id }} of .github/workflows/level-b-controls.yml at the pull request's head ${{ github.event.pull_request.head.sha }}; validation/level_b/controls.py (blob $blob); the plan validation/level_b/plan_s6.md (blob $plan), committed before the run."
            echo "- controls.log: the report; selection.json: the rules and what each step found; candidates.tsv: every qualifying candidate, ranked; tried.tsv: each collection tried and why it was or was not chosen; claims.json: the controls and their claims; joinids/: the extracted cells of each negative control; kang/: the positive control's requests and structure check."
            echo "- The extractions (npz) are the run's artifact level-b-controls-data; their SHA256 are in selection.json and claims.json."
          } > README.md
          find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          for f in $(find . -type f -size +45000000c); do split -b 45000000 -d -a 2 "$f" "$f.part-" && rm "$f"; done
          git init -q -b results/level-b-controls
          git config user.name "metric-autopsy validation"
          git config user.email "validation@users.noreply.github.com"
          git add -A
          git commit -qm "Level B, S6: the controls (workflow run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git push "$remote" HEAD:refs/heads/results/level-b-controls && break; sleep $((i * 10)); done
          test "$(git ls-remote "$remote" refs/heads/results/level-b-controls | cut -f1)" = "$(git rev-parse HEAD)"
          cat controls.log
