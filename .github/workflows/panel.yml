# The blind run of the confirmatory panel (validation/prereg/v1.md, section 8).
#
# Real run: the project owner pushes the tag `panel-v1-run` on a commit whose engine, panel code,
# pinned requirements and this file are byte-identical to the frozen tag v0.3.0-prereg (checked
# by `blind.py guard`), with backgrounds.json and pilot.json committed. The key is the repository
# secret KEY_SEED, checked against the commitment in v0.3.0-prereg's message; it reaches only the
# shard step. Nothing writes to the repository: every job reads, and the results are artifacts.
#
# Dry run: on pull requests that touch the panel, simulated backgrounds and a public test key
# (no secret is referenced), two shards of a few datasets each, to test this workflow and time
# the engine on GitHub's runners.
name: Blind panel v1

on:
  push:
    tags: ["panel-v1-run"]
  pull_request:
    paths:
      - "validation/prereg/**"
      - ".github/workflows/panel.yml"

permissions:
  contents: read

concurrency:
  group: panel-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  FROZEN_TAG: v0.3.0-prereg
  REAL: ${{ github.event_name == 'push' && github.ref == 'refs/tags/panel-v1-run' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      n_shards: ${{ steps.plan.outputs.n_shards }}
      compact: ${{ steps.prep.outputs.compact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned environment and the engine from this commit
        run: |
          python -m pip install --upgrade pip
          pip install -r validation/prereg/requirements-panel.txt
          pip install --no-deps -e .
      - name: The code is the frozen tag's (real run only)
        if: env.REAL == 'true'
        run: python validation/prereg/blind.py guard --frozen-tag "$FROZEN_TAG"
      - name: Shards
        id: plan
        run: |
          if [ "$REAL" = "true" ]; then n=20; else n=2; fi
          echo "n_shards=$n" >> "$GITHUB_OUTPUT"
          echo "shards=$(python -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"
      - name: Backgrounds (downloaded, sha256-checked, planned and compacted)
        id: prep
        run: |
          if [ "$REAL" = "true" ]; then
            python validation/prereg/blind.py prepare --backgrounds validation/prereg/backgrounds.json --out compact
          else
            python validation/prereg/blind.py prepare --dry-run --out compact
          fi
          echo "compact=$(cat compact/SHA256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: compact
          path: compact/
          retention-days: 90

  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags origin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned environment and the engine from this commit
        run: |
          python -m pip install --upgrade pip
          pip install -r validation/prereg/requirements-panel.txt
          pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: compact
          path: compact
      - name: Blind run of this shard
        if: env.REAL == 'true'
        env:
          KEY_SEED: ${{ secrets.KEY_SEED }}
        run: >-
          python validation/prereg/blind.py run --compact compact
          --expect-compact "${{ needs.prepare.outputs.compact }}"
          --pilot validation/prereg/pilot.json --commitment-tag "$FROZEN_TAG"
          --shard ${{ matrix.shard }} --shards ${{ needs.prepare.outputs.n_shards }}
          --workers "$(nproc)" --out out
      - name: Dry run of this shard (public test key, simulated backgrounds)
        if: env.REAL != 'true'
        run: >-
          python validation/prereg/blind.py run --dry-run --compact compact
          --expect-compact "${{ needs.prepare.outputs.compact }}"
          --shard ${{ matrix.shard }} --shards ${{ needs.prepare.outputs.n_shards }}
          --limit 4 --workers "$(nproc)" --out out
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          retention-days: 90

  collect:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r validation/prereg/requirements-panel.txt
          pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Merge the shards
        run: |
          if [ "$REAL" = "true" ]; then
            python validation/prereg/blind.py collect --shards-dir shards --out results --pilot validation/prereg/pilot.json
          else
            python validation/prereg/blind.py collect --shards-dir shards --out results
          fi
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: panel-v1-results
          path: results/
          retention-days: 90
